# Single entry point for the local stack: serves the SPA and proxies the API (same origin, no CORS).
server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 10m;            # resumes up to MAX_RESUME_MB (5 MB) plus multipart overhead
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Server-Sent Events: no buffering, long-lived connection, so live updates arrive immediately.
  location /api/v1/events {
    proxy_pass http://api:4000;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
  }

  # REST API, Swagger docs and signed file downloads
  location /api/ {
    proxy_pass http://api:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location = /health { proxy_pass http://api:4000; }

  # Hashed build assets can be cached forever.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }
  # SPA: every other route serves index.html.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
